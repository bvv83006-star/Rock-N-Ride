<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Rock'n Ride Cars</title>
<link rel="stylesheet" href="/style.css" />
<style>
.start-screen{position:fixed;inset:0;background:
  radial-gradient(circle at 20% 20%,#1e0a3a,#0a0a0e 60%),
  radial-gradient(circle at 80% 80%,#3a0a1e,#0a0a0e 60%);
  display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:999;padding:24px;text-align:center;overflow-y:auto;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.start-title{font-size:clamp(34px,10vw,66px);font-weight:900;letter-spacing:-.04em;font-style:italic;line-height:.92;margin-bottom:8px;color:#fff;text-shadow:0 12px 50px #000,0 0 40px #ffd40022}
.start-title em{color:#ffd400;font-style:italic;display:block;text-shadow:0 12px 50px #000,0 0 60px #ffd40066}
.start-sub{font-size:11px;letter-spacing:.3em;color:#ffd400;font-weight:900;margin-bottom:36px;text-transform:uppercase}

.panel{width:100%;max-width:340px;background:#16161cf0;border:1px solid #ffffff14;border-radius:22px;padding:22px;box-shadow:0 30px 80px #00000099;backdrop-filter:blur(20px)}
.input-group{margin-bottom:20px;text-align:left}
.input-group:last-of-type{margin-bottom:14px}
.input-group label{display:block;font-size:10px;font-weight:900;letter-spacing:.16em;color:#8a8a99;margin-bottom:9px;text-transform:uppercase}
.input-group input{width:100%;background:#0a0a0e;border:1.5px solid #ffffff1a;border-radius:12px;color:#fff;padding:14px 16px;font-size:15px;font-weight:700;outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit}
.input-group input:focus{border-color:#ffd400;box-shadow:0 0 0 3px #ffd40022}

.color-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.color-grid button{position:relative;aspect-ratio:1;border-radius:14px;border:2px solid #ffffff14;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;overflow:hidden}
.color-grid button::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff33,#00000033);pointer-events:none}
.color-grid button:active{transform:scale(.95)}
.color-grid button.selected{border-color:#ffd400;box-shadow:0 0 0 3px #ffd40044,0 0 30px #ffd40088;transform:scale(1.08)}
.color-grid button.selected::before{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:900;text-shadow:0 2px 12px #000;z-index:2}

.start-btn{width:100%;padding:18px 22px;background:linear-gradient(135deg,#ffd400,#ff8c00);color:#0a0a0e;font-size:16px;font-weight:900;letter-spacing:.12em;border-radius:14px;border:none;cursor:pointer;transition:filter .15s,transform .1s;margin-top:18px;font-family:inherit;box-shadow:0 10px 40px #ffd40044}
.start-btn:active{filter:brightness(.92);transform:scale(.98)}

.hint{font-size:11px;color:#666a78;margin-top:20px;font-weight:700;letter-spacing:.06em;line-height:1.5;max-width:340px}
.hint b{color:#ffd400}
</style>
</head>
<body>
<div class="start-screen">
  <h1 class="start-title">ROCK'N RIDE <em>CARS</em></h1>
  <p class="start-sub">10 Cars • 10 Powers • Open City</p>

  <div class="panel">
    <div class="input-group">
      <label>Your Name</label>
      <input type="text" id="usernameInput" maxlength="20" placeholder="Enter name…" autocomplete="off" />
    </div>

    <div class="input-group">
      <label>Car Colour</label>
      <div class="color-grid" id="colorGrid">
        <button data-color="#ff3b30" class="selected" style="background:#ff3b30"></button>
        <button data-color="#ff8c00" style="background:#ff8c00"></button>
        <button data-color="#ffd400" style="background:#ffd400"></button>
        <button data-color="#38f7c0" style="background:#38f7c0"></button>
        <button data-color="#00d9ff" style="background:#00d9ff"></button>
        <button data-color="#2c7cff" style="background:#2c7cff"></button>
        <button data-color="#8833cc" style="background:#8833cc"></button>
        <button data-color="#ff1493" style="background:#ff1493"></button>
        <button data-color="#f7f7fb" style="background:#f7f7fb"></button>
        <button data-color="#8a8a99" style="background:#8a8a99"></button>
        <button data-color="#222222" style="background:#222222"></button>
        <button data-color="#39ff14" style="background:#39ff14"></button>
      </div>
    </div>

    <button class="start-btn" id="startButton">START ENGINE ›</button>
  </div>

  <p class="hint"><b>Tilt</b> phone to steer • <b>E</b> ability • <b>Space</b> drift • Find the glowing bowl for the <b>700 glitch</b></p>
</div>
<script>
(function(){
  const input = document.getElementById('usernameInput');
  const colorGrid = document.getElementById('colorGrid');
  let selectedColor = '#ff3b30';

  const savedName = localStorage.getItem('username') || '';
  const savedColor = localStorage.getItem('playerColor') || '#ff3b30';
  if(savedName) input.value = savedName;
  selectedColor = savedColor;
  colorGrid.querySelectorAll('button').forEach(b => {
    b.classList.toggle('selected', b.dataset.color === selectedColor);
  });

  colorGrid.addEventListener('click', e => {
    const btn = e.target.closest('button[data-color]');
    if(!btn) return;
    colorGrid.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedColor = btn.dataset.color;
  });

  document.getElementById('startButton').addEventListener('click', () => {
    const name = (input.value || '').trim().slice(0, 20) || 'Player';
    localStorage.setItem('username', name);
    localStorage.setItem('playerColor', selectedColor);
    // Unlock audio (browsers require interaction)
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume();
      localStorage.setItem('musicUnlocked', '1');
    } catch(e){}
    window.location.href = 'index.html';
  });

  input.addEventListener('keydown', e => {
    if(e.key === 'Enter') document.getElementById('startButton').click();
  });
})();
</script>
</body>
</html>
